<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore a responsive temple album featuring beautiful temple images, mobile navigation, and modern web design using HTML, CSS, and JavaScript.">
    <meta name="author" content="Emmanuel Eze">

    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>
<body>

<header>
    <div class="header-container">
        <h1>Temple Album</h1>

        <button id="menu" aria-label="Menu"></button>

        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </div>
</header>

<main>
    <h2>Home</h2>

    <div class="gallery">

        <figure>
            <img src="images/san-diego-temple.jpg" alt="San Diego California Temple" loading="lazy">
            <figcaption>San Diego California</figcaption>
        </figure>

        <figure>
            <img src="images/rome-italy-temple.jpg" alt="Rome Italy Temple" loading="lazy">
            <figcaption>Rome Italy</figcaption>
        </figure>

        <figure>
            <img src="images/accra-ghana-temple.jpg" alt="Accra Ghana Temple" loading="lazy">
            <figcaption>Accra Ghana</figcaption>
        </figure>

        <figure>
            <img src="images/salt-lake-temple.jpg" alt="Salt Lake Temple" loading="lazy">
            <figcaption>Salt Lake</figcaption>
        </figure>

        <figure>
            <img src="images/aba-nigeria-temple.jpg" alt="Aba Nigeria Temple" loading="lazy">
            <figcaption>Aba Nigeria</figcaption>
        </figure>

        <figure>
            <img src="images/tokyo-japan-temple.jpg" alt="Tokyo Japan Temple" loading="lazy">
            <figcaption>Tokyo Japan</figcaption>
        </figure>

        <figure>
            <img src="images/paris-france-temple.jpg" alt="Paris France Temple" loading="lazy">
            <figcaption>Paris France</figcaption>
        </figure>

        <figure>
            <img src="images/nauvoo-temple.jpg" alt="Nauvoo Temple" loading="lazy">
            <figcaption>Nauvoo</figcaption>
        </figure>

        <figure>
            <img src="images/kinshasa-temple.jpg" alt="Kinshasa Temple" loading="lazy">
            <figcaption>Kinshasa</figcaption>
        </figure>

    </div>
</main>

<footer>
    <p>
        &copy; <span id="currentyear"></span> 🌸 Emmanuel Eze 🌸 Nigeria
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>
